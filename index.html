<html lang="en">
<head>

<title>Flowtide</title>
<meta name="theme-color" content="#120e2a">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 32 32&#39;%3E%3Crect width=&#39;32&#39; height=&#39;32&#39; rx=&#39;7.5&#39; fill=&#39;%231a1530&#39;/%3E%3CclipPath id=&#39;c&#39;%3E%3Ccircle cx=&#39;16&#39; cy=&#39;16&#39; r=&#39;9.6&#39;/%3E%3C/clipPath%3E%3Cpath clip-path=&#39;url(%23c)&#39; fill=&#39;%23d4c8ff&#39; d=&#39;M4 17.6c2.4-1.9 4.8-1.9 7.2 0s4.8 1.9 7.2 0 4.8-1.9 7.2 0 4.8 1.9 7.2 0V30H4z&#39;/%3E%3Ccircle cx=&#39;16&#39; cy=&#39;16&#39; r=&#39;9.6&#39; fill=&#39;none&#39; stroke=&#39;%23d4c8ff&#39; stroke-width=&#39;2.2&#39;/%3E%3C/svg%3E">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  // This source page only runs through the dev server; double-clicked from disk the
  // browser blocks /src/main.jsx and the page stays blank. Say so instead.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (document.getElementById('root').childElementCount) return;
      document.body.style.cssText = 'margin:0;background:#07060b;color:#f4f2f8;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box';
      document.body.innerHTML = '<div style="max-width:520px"><h1 style="font-size:22px;margin:0 0 12px">Flowtide didn’t start</h1>'
        + '<p style="margin:0 0 10px">This is the source page, which only works through the development server.</p>'
        + '<p style="margin:0 0 10px">To use the app, open <b>dist\\index.html</b> in this same folder instead.</p>'
        + '<p style="margin:0;color:#9893a8">For development, run <code>npm run dev</code> in this folder and open the address it prints.</p></div>';
    }, 1500);
  });
</script>
</body>
</html>
